services:
  firmware-updater:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_REAL_FLASHING: ${VITE_ENABLE_REAL_FLASHING:-false}
        VITE_ENABLE_READ_ONLY_DEVICE_CONNECTION: ${VITE_ENABLE_READ_ONLY_DEVICE_CONNECTION:-false}
    image: firmware-updater:local
    expose:
      - "8080"
    networks:
      n8n_network:
        aliases:
          - firmware-updater
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  n8n_network:
    external: true
